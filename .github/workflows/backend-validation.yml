name: Backend Validation

on:
  pull_request:
    paths:
      - 'packages/sprindle/**'
      - 'apps/api/**'
      - 'packages/contracts/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/backend-validation.yml'
  push:
    paths:
      - 'packages/sprindle/**'
      - 'apps/api/**'
      - 'packages/contracts/**'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/backend-validation.yml'

permissions:
  contents: read

concurrency:
  group: backend-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      APP_ORIGIN: http://localhost:5173
      API_PORT: '3000'
      BETTER_AUTH_URL: http://localhost:3000
      # Dummy CI value, not a real credential.
      BETTER_AUTH_SECRET: ci-secret-value-that-is-long-enough-32

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.8.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint sprindle
        run: pnpm --filter @southneuhof/sprindle lint

      - name: Type-check sprindle
        run: pnpm --filter @southneuhof/sprindle type-check

      - name: Test sprindle
        run: pnpm --filter @southneuhof/sprindle test

      - name: Lint api
        run: pnpm --filter @southneuhof/api lint

      - name: Type-check api
        run: pnpm --filter @southneuhof/api type-check

      - name: Apply api database migrations
        run: pnpm --filter @southneuhof/api db:migrate

      - name: Test api
        run: pnpm --filter @southneuhof/api test
