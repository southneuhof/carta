name: Web Validation

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'packages/loom/**'
      - 'packages/utilities/**'
      - 'packages/sdk/**'
      - '**/package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/web-validation.yml'
  push:
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'packages/loom/**'
      - 'packages/utilities/**'
      - 'packages/sdk/**'
      - '**/package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/web-validation.yml'

permissions:
  contents: read

concurrency:
  group: web-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint affected packages
        run: pnpm exec turbo run lint --affected --output-logs=errors-only

      - name: Type-check affected packages
        run: pnpm exec turbo run type-check --affected --output-logs=errors-only

      - name: Test affected packages
        run: pnpm exec turbo run test --affected --filter=@southneuhof/framework-web --output-logs=errors-only

      - name: Build web app
        run: pnpm --filter @southneuhof/framework-web build-only
