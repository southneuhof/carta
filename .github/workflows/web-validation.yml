name: Web Validation

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'packages/is-vue-framework/**'
      - 'packages/utilities/**'
      - 'packages/sdk/**'
      - 'packages/contracts/**'
      - 'packages/domain/**'
      - '**/package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/web-validation.yml'
  push:
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'packages/is-vue-framework/**'
      - 'packages/utilities/**'
      - 'packages/sdk/**'
      - 'packages/contracts/**'
      - 'packages/domain/**'
      - '**/package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/web-validation.yml'

permissions:
  contents: read

concurrency:
  group: web-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.8.0 --activate

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web app
        run: pnpm --filter @southneuhof/framework-web lint

      - name: Type-check web app
        run: pnpm --filter @southneuhof/framework-web type-check

      - name: Test web app
        run: pnpm --filter @southneuhof/framework-web test

      - name: Build web app
        run: pnpm --filter @southneuhof/framework-web build
